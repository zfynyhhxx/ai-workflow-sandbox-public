name: Deterministic CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the same public snapshot of starter inputs
        run: |
          mkdir -p "$HOME/.local/share/ai-workflow/AI-Workflow-Starter-2026-11-11"
          cp -R vendor/starter/. "$HOME/.local/share/ai-workflow/AI-Workflow-Starter-2026-11-11/"
      - name: Core tests, syntax, secret scan and diff checks
        run: sh scripts/verify.sh
